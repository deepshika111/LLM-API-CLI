[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-api-playground"
version = "0.1.0"
description = "A command-line playground for LLM APIs"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "python-dotenv"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_playground", "llm_playground.*"]
